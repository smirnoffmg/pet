<text x="20.00px" y="50.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#31BB71">❯</tspan><tspan xml:space="preserve"> pet reject solution-hypothesis SOL-0002 --rationale fails GDPR review for prospect data</tspan></text><text x="20.00px" y="66.20px" xml:space="preserve"/><text x="20.00px" y="81.80px" xml:space="preserve"><tspan xml:space="preserve">Rejection checklist — SOL-0002 (solution-hypothesis)</tspan></text><text x="20.00px" y="97.40px" xml:space="preserve"><tspan xml:space="preserve">  ▸ This alternative was genuinely considered, not invented to look considered</tspan></text><text x="20.00px" y="113.00px" xml:space="preserve"><tspan xml:space="preserve">  ▸ The rationale names a concrete blocker — cost, risk, compliance, timing</tspan></text><text x="20.00px" y="128.60px" xml:space="preserve"><tspan xml:space="preserve">  ▸ The rationale will still be legible to someone who joins in two years</tspan></text><text x="20.00px" y="144.20px" xml:space="preserve"><tspan xml:space="preserve">  ▸ It is rejected, not merely deferred (a deferred option stays proposed)</tspan></text><text x="20.00px" y="159.80px" xml:space="preserve"><tspan xml:space="preserve">  ▸ Once committed, this is frozen — the rationale cannot be reworded later</tspan></text><text x="20.00px" y="175.40px" xml:space="preserve"><tspan xml:space="preserve">Review each item before confirming.</tspan></text><text x="20.00px" y="191.00px" xml:space="preserve"/><text x="20.00px" y="206.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#31BB71">✔ </tspan><tspan xml:space="preserve">Reject SOL-0002? This is final once committed. </tspan><tspan xml:space="preserve" fill="#04D7D7">Yes</tspan></text><text x="20.00px" y="222.20px" xml:space="preserve"><tspan xml:space="preserve">Rejected SOL-0002. Run `pet validate` before commit.</tspan></text>
</g>
